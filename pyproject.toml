[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E501",   # Line length
    "BLE001", # Blind exception catching
    "F401",   # Unused import
    "F841",   # Unused variable
    "E402",   # Module level import not at top of file
    "W291",   # Trailing whitespace
    "W293"    # Blank line whitespace
]
